services:
  db:
    image: postgres:16-alpine
    container_name: taskpriority-db
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_DB: taskpriority
      POSTGRES_USER: taskpriority
      POSTGRES_PASSWORD: taskpriority
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpriority -d taskpriority"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: taskpriority-minio
    mem_limit: 512m
    cpus: 0.5
    environment:
      # Local-dev-only credentials, same spirit as the app's JWT_SECRET below - never reused in a
      # real deployment, where STORAGE_S3_* would point at real S3/an operator-managed MinIO with
      # real credentials instead.
      MINIO_ROOT_USER: taskpriority-dev
      MINIO_ROOT_PASSWORD: taskpriority-dev-secret
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket provisioning, run once per `docker compose up` rather than on every app
  # startup: `app` no longer needs to call S3 CreateBucket itself for local dev (S3AttachmentStorage
  # still attempts it as a resilient, non-fatal fallback - see its ensureBucketExists() javadoc -
  # but this makes that fallback a no-op on the happy path). Keeps bucket provisioning an
  # infrastructure concern, same as in a real deployment where it's provisioned out of band.
  minio-init:
    image: minio/mc:latest
    container_name: taskpriority-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 taskpriority-dev taskpriority-dev-secret &&
        mc mb --ignore-existing local/tracker-attachments
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: taskpriority-redis
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpriority-app
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/taskpriority
      DB_USERNAME: taskpriority
      DB_PASSWORD: taskpriority
      # Local-dev-only JWT signing secret. This file is local Docker Compose infrastructure,
      # not application config - never reuse this value in a real deployment; override
      # JWT_SECRET with a real random secret there instead.
      JWT_SECRET: local-docker-compose-dev-only-jwt-secret-do-not-use-in-prod
      # This stack serves both frontend and backend over plain HTTP - a browser will silently
      # refuse to set/send a Secure cookie there. Only disable this for local, non-TLS setups.
      COOKIE_SECURE: "false"
      # New note attachment uploads go to the minio service above instead of PostgreSQL - see
      # AttachmentStorageConfig and the "Note attachment storage" README section.
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_BUCKET: tracker-attachments
      STORAGE_S3_ACCESS_KEY: taskpriority-dev
      STORAGE_S3_SECRET_KEY: taskpriority-dev-secret
      STORAGE_S3_PATH_STYLE_ACCESS: "true"
      # Distributed auth rate limiting (see AuthRateLimitService) shares its counters with the
      # redis service above instead of each instance tracking its own.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${APP_PORT:-8080}:8080"

  frontend:
    image: node:22-alpine
    container_name: taskpriority-frontend
    working_dir: /app
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      - app
    environment:
      VITE_API_BASE_URL: http://localhost:${APP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "
        if [ ! -f node_modules/.package-lock.json ] || ! cmp -s package-lock.json node_modules/.package-lock.json;
        then npm ci; fi &&
        npm run dev -- --host 0.0.0.0
      "

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
