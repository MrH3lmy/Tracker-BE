services:
  db:
    image: postgres:16-alpine
    container_name: taskpriority-db
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_DB: taskpriority
      POSTGRES_USER: taskpriority
      POSTGRES_PASSWORD: taskpriority
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpriority -d taskpriority"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: taskpriority-minio
    mem_limit: 512m
    cpus: 0.5
    environment:
      # Local-dev-only credentials, same spirit as the app's JWT_SECRET below - never reused in a
      # real deployment, where STORAGE_S3_* would point at real S3/an operator-managed MinIO with
      # real credentials instead.
      MINIO_ROOT_USER: taskpriority-dev
      MINIO_ROOT_PASSWORD: taskpriority-dev-secret
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket provisioning, run once per `docker compose up` rather than on every app
  # startup: `app` no longer needs to call S3 CreateBucket itself for local dev (S3AttachmentStorage
  # still attempts it as a resilient, non-fatal fallback - see its ensureBucketExists() javadoc -
  # but this makes that fallback a no-op on the happy path). Keeps bucket provisioning an
  # infrastructure concern, same as in a real deployment where it's provisioned out of band.
  minio-init:
    image: minio/mc:latest
    container_name: taskpriority-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 taskpriority-dev taskpriority-dev-secret &&
        mc mb --ignore-existing local/tracker-attachments
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: taskpriority-redis
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpriority-app
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/taskpriority
      DB_USERNAME: taskpriority
      DB_PASSWORD: taskpriority
      # Local-dev-only JWT signing secret. This file is local Docker Compose infrastructure,
      # not application config - never reuse this value in a real deployment; override
      # JWT_SECRET with a real random secret there instead.
      JWT_SECRET: local-docker-compose-dev-only-jwt-secret-do-not-use-in-prod
      # This stack serves both frontend and backend over plain HTTP - a browser will silently
      # refuse to set/send a Secure cookie there. Only disable this for local, non-TLS setups.
      COOKIE_SECURE: "false"
      # New note attachment uploads go to the minio service above instead of PostgreSQL - see
      # AttachmentStorageConfig and the "Note attachment storage" README section.
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_BUCKET: tracker-attachments
      STORAGE_S3_ACCESS_KEY: taskpriority-dev
      STORAGE_S3_SECRET_KEY: taskpriority-dev-secret
      STORAGE_S3_PATH_STYLE_ACCESS: "true"
      # Distributed auth rate limiting (see AuthRateLimitService) shares its counters with the
      # redis service above instead of each instance tracking its own.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${APP_PORT:-8080}:8080"

  frontend:
    image: node:22-alpine
    container_name: taskpriority-frontend
    working_dir: /app
    # 1g is empirically fine for Vite here. It is deliberately NOT raised in response to the
    # frontend container exiting 137: that exit code came from Docker's stop path (SIGTERM
    # ignored by the old `sh -c` wrapper -> SIGKILL after the grace period), not from memory
    # pressure - `OOMKilled=false` on those exits is the tell. See frontend-entrypoint.sh.
    mem_limit: 1g
    cpus: 1.0
    # Run tini as PID 1 so signals reach the dev server and Vite's short-lived child processes
    # (esbuild/rollup workers) get reaped instead of piling up as zombies.
    init: true
    depends_on:
      - app
    environment:
      VITE_API_BASE_URL: http://localhost:${APP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Read-only mount of the entrypoint below - no image build needed for a dev-only container.
      - ./scripts/docker:/opt/tracker/docker:ro
    # Installs dependencies only when package.json/package-lock.json actually changed (tracked by a
    # checksum marker inside the node_modules volume), then execs Vite. See
    # scripts/docker/frontend-entrypoint.sh for why the old inline lockfile comparison always
    # reinstalled and why exec matters for shutdown.
    command: ["sh", "/opt/tracker/docker/frontend-entrypoint.sh"]
    # "Container running" is not "frontend ready" - the container is up for the whole dependency
    # install while nothing is listening yet. This makes the difference visible to `docker compose
    # ps`, which reports (healthy) only once Vite actually serves HTTP.
    #
    # start_period is sized from the worst measured cold install rather than the best: `npm ci` on
    # an empty node_modules volume took ~3.5 minutes on CI-grade hardware and 5-7 minutes on the
    # developer machine where this was first reported. At 300s Docker would have flagged a
    # perfectly healthy install as unhealthy on that machine, so 600s covers it with headroom -
    # and still leaves the launcher's 900s STARTUP_TIMEOUT_SECONDS room to report an unhealthy
    # frontend (first failure ~630s: start_period, then 3 x 10s retries) before it gives up.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
