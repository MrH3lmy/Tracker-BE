# Explicit production profile. Activate with SPRING_PROFILES_ACTIVE=prod (in addition to the base
# application.properties, which still applies - Spring merges profile-specific properties on top
# of the base file rather than replacing it).

# Swagger UI and the raw OpenAPI JSON are development/exploration tools; disabling them in
# production reduces the attack surface (no API shape/schema disclosure to unauthenticated
# scanners) without affecting the actual API, which is unaffected by springdoc being on or off.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Only the liveness/readiness health endpoint is exposed in production - no /actuator/info either,
# to avoid leaking build metadata to unauthenticated callers. Health itself intentionally stays
# unauthenticated (permitAll in SecurityConfig) since orchestrator health checks don't send
# credentials, but it only ever returns UP/DOWN plus liveness/readiness state, never internals.
management.endpoints.web.exposure.include=health

# Structured (JSON) logging in production - see logback-spring.xml's prod <springProfile> section.
# Never log full request/response bodies, tokens, or password hashes in application code:
# AuthService/JwtService already avoid this (see their class comments); keep that invariant when
# adding new logging.

# --- Fail-fast required configuration (issue #259) ---------------------------------------------
# The base application.properties provides convenient localhost/dev-credential defaults for local
# development (`mvn spring-boot:run`, docker-compose). Every one of those defaults is overridden
# here with a bare, no-default placeholder, so starting with SPRING_PROFILES_ACTIVE=prod and a
# missing env var fails immediately with "Could not resolve placeholder 'X'" - naming the missing
# property without ever printing its value (there is none to print) - rather than silently
# accepting a localhost URL or predictable dev credentials in a real deployment. See the README's
# "Production configuration" section for the full list of required variables and which are secret.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Redis backs distributed auth rate limiting (see AuthRateLimitService) and is deliberately
# fail-open at *runtime* - a Redis outage after startup must not take authentication down with it
# (see RedisRateLimiter). That resilience is orthogonal to this: the operator must still say
# explicitly where Redis lives rather than a real deployment silently defaulting to localhost,
# which would silently disable cross-instance rate-limit sharing rather than fail loudly.
spring.data.redis.host=${REDIS_HOST}
# ProductionConfigValidator (see com.taskpriority.config) enforces the checks a bare placeholder
# can't express - CORS must be non-wildcard, for example - and fails with the same
# no-secret-values-in-the-error-message policy.
