spring.application.name=task-priority-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskpriority}
spring.datasource.username=${DB_USERNAME:taskpriority}
spring.datasource.password=${DB_PASSWORD:taskpriority}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Comma-separated browser origins allowed to call the API during local/frontend development.
# Override with CORS_ALLOWED_ORIGINS when the frontend is served from a different host or port.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Maximum multipart upload sizes for screenshot requests. Keep these at or above the business validation limit below.
spring.servlet.multipart.max-file-size=${NOTE_SCREENSHOT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${NOTE_SCREENSHOT_MAX_REQUEST_SIZE:6MB}

# Maximum screenshot attachment size for notes, in bytes (default 5 MiB).
app.notes.screenshots.max-file-size-bytes=${NOTE_SCREENSHOT_MAX_FILE_SIZE_BYTES:5242880}

# S3-compatible object storage for new note attachment uploads (see AttachmentStorageConfig).
# Disabled by default - every environment that doesn't set STORAGE_S3_ENABLED=true keeps storing
# attachment bytes in PostgreSQL exactly as before. docker-compose.yml's minio service shows a
# working local example; endpoint/path-style-access only matter for a non-AWS provider like MinIO.
app.storage.s3.enabled=${STORAGE_S3_ENABLED:false}
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
app.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:tracker-attachments}
app.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
app.storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}

# JWT signing secret for access tokens. MUST be set via the JWT_SECRET environment variable
# (at least 32 random bytes) in every real environment - there is deliberately no default here,
# since a leaked/guessable signing secret is a total authentication bypass.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}

# Attributes for the HttpOnly refresh-token cookie (see AuthController). Secure defaults to true
# (required outside plain-http local dev) - override COOKIE_SECURE=false only for a non-TLS local
# setup. SameSite defaults to Lax, which works for same-site deployments (frontend/backend on the
# same registrable domain, e.g. different ports/subdomains); switch COOKIE_SAME_SITE to "None"
# (and keep Secure=true) if the frontend and backend end up on genuinely different sites.
app.security.cookies.secure=${COOKIE_SECURE:true}
app.security.cookies.same-site=${COOKIE_SAME_SITE:Lax}

# Distributed rate limiting for the unauthenticated auth endpoints (see AuthRateLimitService).
# Redis-backed by default so limits are shared across every application instance rather than
# reset by restarting one of them; app.rate-limit.redis-enabled=false switches to a bounded
# single-instance in-memory limiter instead (used by the local-test profile, where standing up
# Redis just to exercise auth endpoints is unnecessary overhead).
app.rate-limit.redis-enabled=${RATE_LIMIT_REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
# Comma-separated CIDR blocks (IPv4/IPv6) whose X-Forwarded-For header is trusted for client-IP
# resolution - e.g. your load balancer/reverse proxy's subnet. Empty (the default) means every
# X-Forwarded-For header is ignored and the direct TCP peer is always used, which is correct
# behind no proxy but wrong behind one (every request will appear to come from the proxy's IP).
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
# Per-endpoint policies: max attempts allowed within the window, independently configurable and
# independently tracked (a burst against one endpoint/dimension never throttles another). See the
# README's "Authentication rate limiting" section for tuning guidance.
app.rate-limit.login.ip.max-attempts=${RATE_LIMIT_LOGIN_IP_MAX_ATTEMPTS:20}
app.rate-limit.login.ip.window-seconds=${RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS:900}
app.rate-limit.login.account.max-attempts=${RATE_LIMIT_LOGIN_ACCOUNT_MAX_ATTEMPTS:5}
app.rate-limit.login.account.window-seconds=${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_SECONDS:900}
app.rate-limit.register.ip.max-attempts=${RATE_LIMIT_REGISTER_IP_MAX_ATTEMPTS:10}
app.rate-limit.register.ip.window-seconds=${RATE_LIMIT_REGISTER_IP_WINDOW_SECONDS:3600}
app.rate-limit.refresh.ip.max-attempts=${RATE_LIMIT_REFRESH_IP_MAX_ATTEMPTS:10}
app.rate-limit.refresh.ip.window-seconds=${RATE_LIMIT_REFRESH_IP_WINDOW_SECONDS:300}

# Entitlement limits for the FREE tier. PREMIUM users are unlimited.
app.entitlement.ai-quota.free-monthly-limit=${AI_QUOTA_FREE_MONTHLY_LIMIT:20}
app.entitlement.storage-quota.free-bytes=${STORAGE_QUOTA_FREE_BYTES:104857600}
app.entitlement.session-cap.free-max-active=${SESSION_CAP_FREE_MAX_ACTIVE:1}
app.entitlement.saved-view-cap.free-max=${SAVED_VIEW_CAP_FREE_MAX:1}

# Reminder producer/outbox dispatcher scheduled jobs. Safe to run on multiple app instances at
# once - see the "Reminder/notification outbox operations" section in README.md.
app.reminders.scheduling-enabled=${REMINDERS_SCHEDULING_ENABLED:true}
app.notifications.dispatch-batch-size=${NOTIFICATIONS_DISPATCH_BATCH_SIZE:50}
app.notifications.max-dispatch-attempts=${NOTIFICATIONS_MAX_DISPATCH_ATTEMPTS:5}
app.notifications.processing-lease-timeout-minutes=${NOTIFICATIONS_PROCESSING_LEASE_TIMEOUT_MINUTES:5}

# Actuator: only health/info exposed by default (no beans/env/configprops leaking internals over
# HTTP). The `prod` profile (application-prod.properties) restricts this further. Liveness/
# readiness probes are enabled so /actuator/health reports separate liveness/readiness states,
# matched by the Docker HEALTHCHECK and any orchestrator probe.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# spring-boot-starter-data-redis auto-registers a Redis health contributor that would otherwise
# flip /actuator/health (and therefore the Docker HEALTHCHECK/orchestrator readiness probe) to
# DOWN whenever Redis is unreachable - directly undermining RedisRateLimiter's fail-open design
# (auth keeps working without Redis; the app itself must not be killed/pulled from rotation over
# it). Disabled here rather than per-profile since the fail-open intent applies everywhere,
# including prod.
management.health.redis.enabled=false
# Same fail-open reasoning as Redis above, for AttachmentStorageHealthIndicator (app.storage.s3.*):
# object-storage (MinIO/S3) is only used for note attachment uploads/downloads, which already fail
# loudly and explicitly on their own (see S3AttachmentStorage) - a MinIO/S3 outage must not also
# flip /actuator/health (Docker HEALTHCHECK, liveness, readiness) to DOWN and take the entire app
# out of rotation over one optional dependency. Disabled by default; an operator who wants storage
# reachability to gate readiness in a given deployment can override this explicitly.
management.health.attachmentStorage.enabled=false
